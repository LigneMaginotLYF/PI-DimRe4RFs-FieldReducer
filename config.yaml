dataset:
  n_samples: 500
  # Number of field expansion terms (basis functions) for Young's modulus.
  # Preferred key (new): n_terms_E
  # Legacy key (deprecated, still supported): n_kl_terms_E
  n_terms_E: 5
  seed: 42
  # Reuse an existing dataset instead of regenerating it.
  # Set to true and optionally override path_X / path_Y.
  reuse: false
  # path_X: data/X_train.npy
  # path_Y: data/Y_train.npy

material:
  E_ref: 10.0e6
  permeability_ref: 1.0e-12
  permeability_h: 1.0e-12
  permeability_v: 1.0e-12
  poisson_ratio: 0.3
  biot_coefficient: 0.8
  fluid_viscosity: 1.0e-3
  porosity: 0.3
  fluid_bulk_modulus: 2.2e9
  applied_load: 1.0e6
  pore_pressure_bottom: 1.0e5

domain:
  length_x: 1.0
  length_z: 1.0

solver:
  # Problem dimensionality.
  # Allowed values: "2d" | "1d"
  # 1d: single vertical column; n_nodes_x must be set to 1.
  # 2d: full 2-D plane-strain domain (default).
  type: "2d"

  # Physical regime.
  # Allowed values: "steady_state" | "transient"
  # steady_state: Darcy steady-state flow; analytical pressure profile (default).
  # transient   : Terzaghi-Biot time-dependent consolidation; requires t_final.
  response_mode: "steady_state"

  # Number of finite-difference nodes in x and z directions.
  # For 1-D problems use n_nodes_x: 1.
  n_nodes_x: 20
  n_nodes_z: 20

  # Non-dimensional final time for transient simulations.
  # T = c_v · t / L_z²; T = 1.0 corresponds to approximately 95 % primary
  # consolidation.  Only relevant when response_mode = "transient".
  t_final: 1.0

  # Maximum number of explicit time steps for transient simulations.
  # The solver will use the stability-limited step count up to this cap.
  # Increase for high-fidelity production runs (the solver will warn when capped).
  max_time_steps: 2000

random_field:
  covariance: "matern"

  # Basis type for Phase-1 random field generation.
  # Allowed values: "kl" | "dct"
  # "kl"  (default): per-sample Matérn-KL eigenbasis.  The eigenbasis is
  #        recomputed for each (nu, length_scale) draw, which provides exact
  #        Matérn covariance structure but is slower and basis-dependent.
  # "dct": fixed 2D DCT-II basis (deterministic, correlation-structure
  #        independent).  Matérn-like structure is obtained by shaping the
  #        variance of each DCT coefficient using an approximate 2D Matérn
  #        spectral density (see DCTField docstring for formula details).
  #        Sampling (nu, length_scale) reshapes coefficient variance without
  #        changing basis functions, so two samples with the same coefficients
  #        produce the same log-field regardless of the Matérn parameters used.
  field_basis: "kl"

  # Global amplitude multiplier on log(E).
  # logE(x,z) = logE_std * sum_k a_k * psi_k(x,z)
  # Decreasing logE_std makes GT settlements smoother / less variable.
  # Alias: field_fluctuation_scale (both accepted; logE_std takes priority).
  logE_std: 1.0

  # Smoothness parameter ν for the Matérn covariance kernel.
  # nu_sampling: if true, ν is drawn uniformly from nu_range each sample.
  # Set to false and provide nu_ref to use a fixed ν (required for a meaningful
  # identity-mapping verification).
  nu_sampling: true
  nu_range: [0.5, 2.5]
  nu_ref: 1.5         # fixed ν used when nu_sampling = false

  # Length scale for the Matérn kernel.
  # length_scale_sampling: if true, ℓ is drawn from length_scale_range per sample.
  # Set to false and provide length_scale_ref for fixed length scale.
  length_scale_sampling: true
  length_scale_range: [0.1, 0.5]
  length_scale_ref: 0.3   # fixed ℓ used when length_scale_sampling = false

  # Per-sample mean variation (DCT basis only).
  # When E_ref_sampling=true, each sample draws a scaling factor from
  # Uniform(E_ref_factor_range) so that the expected field mean equals
  # material.E_ref * factor.  The mean shift is encoded into the DC DCT
  # coefficient (index 0, mode (0,0)) so the xi vector alone carries the
  # mean information without requiring E_ref_factor as a separate input.
  # Has no effect when field_basis != "dct".
  E_ref_sampling: false
  E_ref_factor_range: [0.5, 1.5]

dimension_reducer:
  # Reduced-space dimension.
  # How many scalar parameters describe the low-dimensional material field.
  # Must satisfy d ≤ n_kl_terms_E (KL basis) or d ≤ n_polynomial_basis (polynomial).
  d: 1

  # Basis used to reconstruct the material field from reduced coefficients.
  # Allowed values: "polynomial" | "kl" | "dct"
  # polynomial: multivariate polynomial in (x/L_x, z/L_z); requires d ≤ poly basis size.
  # kl         : truncated KL expansion using reference Matérn params (nu_ref, ls_ref).
  # dct        : first d 2D DCT-II modes (same fixed basis as Phase-1 when
  #              random_field.field_basis = "dct").
  basis_type: "polynomial"

  # Highest polynomial degree (only relevant for basis_type = "polynomial").
  # Allowed values: 1 | 2 | 3 (higher orders add more basis functions)
  # Order 1: 3 functions {1, x, z}
  # Order 2: 6 functions {1, x, z, x², xz, z²}
  # Order 3: 10 functions {… + x³, x²z, xz², z³}
  basis_order: 1

  # Mapping model mode.
  # Allowed values: "learned" | "identity"
  # learned : train NN or PCE to map xi_E -> xi' (default).
  # identity: bypass learning; use xi' = xi_E (first d components).
  #           Requires d = dataset.n_kl_terms_E and best used with
  #           nu_sampling = false, length_scale_sampling = false
  #           for numerical equivalence verification.
  mode: "learned"

  # Train multiple reducer types simultaneously, e.g. ["nn", "pce"].
  # If omitted, defaults to the surrogate.type above.
  # types: ["nn", "pce"]

reduced_lut:
  n_grid_points: 2000
  grid_type: "random"

  # Phase-2 surrogate reuse is currently disabled at the pipeline level.
  # This flag is retained for documentation and future re-enabling, but it
  # has no effect: the LUT and its surrogates are ALWAYS recomputed.
  reuse: false
  # path: models/reduced_lut  # custom directory for the LUT artifacts

surrogate:
  # Primary surrogate type for Phase 2 (LUT forward surrogate) and Phase 3
  # (dimension reducer, unless dimension_reducer.types overrides it).
  # Allowed values: "nn" | "pce"
  type: "nn"

  # NN-specific hyperparameters (used when type = "nn" or types includes "nn")
  hidden_dim: 64
  n_blocks: 3
  epochs: 200
  learning_rate: 1.0e-3
  batch_size: 64

  # PCE-specific hyperparameters (used when type = "pce" or types includes "pce")
  # basis_order is shared with dimension_reducer.basis_order

  # Train multiple surrogate types simultaneously for Phase 2 and/or Phase 3.
  # e.g. ["nn", "pce"] to train both and produce a comparison plot.
  # If omitted, defaults to [type] above.
  # types: ["nn", "pce"]

  # Output representation for the Phase-2 surrogate.
  # Allowed values: "direct" | "dct"
  # "direct" (default): surrogate predicts full settlement profile Y(x) directly.
  # "dct"             : surrogate predicts n_output_modes DCT-II coefficients of
  #                     the settlement profile.  predict() applies inverse DCT to
  #                     return full Y(x).  Smoother (C²) predictions due to truncated
  #                     DCT basis; helps avoid oscillatory artifacts.
  output_representation: "direct"

  # Number of 1D DCT modes to use for the surrogate output.
  # Only used when output_representation = "dct".
  # Smaller values give smoother predictions; larger values retain more detail.
  n_output_modes: 8

phase4:
  # Use direct Biot solver (not surrogate) for the 5 settlement comparison plots.
  # Plots isolate reducer + reduced-field error and avoid Phase-2 oscillations.
  # Metrics are still computed from surrogate predictions for speed.
  # Set to false to use surrogate predictions for plots (faster but may show
  # Phase-2 surrogate oscillations in the comparison curves).
  use_direct_physics_for_plots: true

collocation:
  # Number of collocation points used in Phase-3 physics-driven training.
  # Defaults to all LUT grid points (use reduced_lut.n_grid_points).
  # n_points: 2000

  # Optionally specify explicit physical x-positions for collocation markers
  # in settlement comparison plots.  Leave commented to use all n_nodes_x positions.
  # positions: [0.0, 0.25, 0.5, 0.75, 1.0]

validation:
  train_fraction: 0.6
  val_fraction: 0.2
  test_fraction: 0.2
